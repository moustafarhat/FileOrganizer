name: Release

# Every push to main checks the <Version> in FileOrganizer.csproj. If no
# release exists for that version yet, it builds self-contained
# executables for Windows, Linux and macOS and publishes release
# v<Version>. Pushes without a version bump are skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version and check for existing release
        id: version
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' FileOrganizer.csproj)
          if [ -z "$version" ]; then echo "::error::No <Version> in FileOrganizer.csproj"; exit 1; fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Release $tag already exists, skipping."
            publish=false
          else
            echo "Will publish $tag."
            publish=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          # Windows exe needs a Windows host to embed the manifest/version info;
          # macOS binaries need a macOS host to be ad-hoc signed.
          - { rid: win-x64,   os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Smoke tests
        run: dotnet run --project FileOrganizer.SmokeTest -c Release

      - name: Publish self-contained single-file app
        run: >
          dotnet publish FileOrganizer.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath "FileOrganizer-${{ needs.version.outputs.tag }}-${{ matrix.rid }}.zip"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          rm -f publish/*.pdb publish/*.dbg publish/*.dSYM
          chmod +x publish/FileOrganizer
          tar -czf "FileOrganizer-${{ needs.version.outputs.tag }}-${{ matrix.rid }}.tar.gz" -C publish .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: FileOrganizer-*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
