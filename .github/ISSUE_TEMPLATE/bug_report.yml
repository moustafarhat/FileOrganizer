name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! If files were moved unexpectedly, try **Undo last batch** first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add folder ...
        2. Choose Organize → By type
        3. Click Preview, then Apply
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the release file name, e.g. v1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS (Apple Silicon), macOS (Intel), Linux]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, folder layout, file names that trigger it (please remove anything private).
