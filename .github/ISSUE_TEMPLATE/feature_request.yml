name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the [Roadmap](../blob/main/README.md#roadmap) first. Your idea may already be planned; a 👍 on an existing issue helps us prioritize.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: Every week I have to manually ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
